<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111827" />
  <title>Seoul Trip Companion · 2026</title>
  <meta name="color-scheme" content="light">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginView" class="login-screen">
  <div class="login-card">
    <span class="pill blue">SEOUL 2026</span>

    <h1>Seoul Trip Companion</h1>

    <p class="muted">
      Lịch trình · DSP · Chi tiêu · Địa điểm
    </p>

    <button id="loginBtn" class="btn primary" style="width:100%">
      Đăng nhập bằng Google
    </button>

    <div id="loginError" class="error hidden"></div>
  </div>
</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="appView" class="hidden">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        Seoul Trip Companion
        <small>18–25/10/2026 · Seoul</small>
      </div>

      <div class="user-area">

        <img
          id="avatar"
          class="avatar hidden"
          alt=""
        />

        <span id="userName"></span>

        <button id="logoutBtn" class="btn">
          Thoát
        </button>

      </div>

    </div>


    <nav class="nav" id="nav">

      <button
        data-tab="dashboard"
        class="active"
      >
        Today
      </button>

      <button data-tab="itinerary">
        Lịch trình
      </button>

      <button data-tab="dsp">
        DSP
      </button>

      <button data-tab="expenses">
        Chi tiêu
      </button>

      <button data-tab="places">
        Địa điểm
      </button>

      <button data-tab="more">
        Khác
      </button>

    </nav>

  </header>


  <main id="appMain">

    <section id="tab-dashboard"></section>

    <section
      id="tab-itinerary"
      class="hidden"
    ></section>

    <section
      id="tab-dsp"
      class="hidden"
    ></section>

    <section
      id="tab-expenses"
      class="hidden"
    ></section>

    <section
      id="tab-places"
      class="hidden"
    ></section>

    <section
      id="tab-more"
      class="hidden"
    ></section>

  </main>

  <!-- Quick Add FAB (visible when logged in) -->

  <nav class="bottom-nav" id="navBottom" aria-label="Điều hướng chính">
    <button data-tab="dashboard" class="active"><span class="ico">⌂</span><span>Today</span></button>
    <button data-tab="itinerary"><span class="ico">▤</span><span>Lịch</span></button>
    <button data-tab="dsp"><span class="ico">🎫</span><span>DSP</span></button>
    <button data-tab="expenses"><span class="ico">₩</span><span>Chi</span></button>
    <button data-tab="more"><span class="ico">•••</span><span>Thêm</span></button>
  </nav>

  <button
    id="quickAddFab"
    class="fab"
    type="button"
    aria-label="Quick Add"
    title="Quick Add"
  >
    +
  </button>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <div class="row">

      <h2 id="modalTitle"></h2>

      <button
        id="modalClose"
        class="close-btn"
      >
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<div
  id="toast"
  class="toast hidden"
></div>


<!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<!-- =========================================================
     FIREBASE + APP
========================================================= -->

<script type="module" src="./js/app.js"></script>

</body>
</html>
